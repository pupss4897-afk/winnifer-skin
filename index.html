<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F7FB">
<title>Winnifer 養美研究室</title>
<meta name="description" content="溫妮佛的 30+ 養美小工具：拍照看看今天的膚況、測出你的膚質、算算你的肌膚年齡，再給你一份適合你的保養重點">
<meta property="og:type" content="website">
<meta property="og:title" content="Winnifer 養美研究室｜你的皮膚，現在幾歲？">
<meta property="og:description" content="拍照看膚況・膚質測驗・肌膚年齡 ~ 30+ 女生的養美日常">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap">
<style>
/* 科技時尚・韓系：冷白、全像漸層、黑色重點 ~ 刻意只有一套淺色 */
:root{
  --bg:#F6F7FB; --white:#FFFFFF; --ink:#111216; --mute:#6C7080; --soft:#9AA0B1; --line:rgba(17,18,22,.08);
  --violet:#7A6BFF; --pink:#FF8FB8; --ice:#8FD3FF; --mint:#7FE3C4;
  --holo:linear-gradient(120deg,#E8E3FF 0%,#D9F0FF 34%,#FFE4F0 68%,#FFF4DA 100%);
  --holo-strong:linear-gradient(120deg,#B9ADFF 0%,#9EDBFF 35%,#FFB2D0 70%,#FFE3A6 100%);
  --sans:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif; --latin:"Manrope","Helvetica Neue",Arial,sans-serif;
  --card:0 1px 0 rgba(255,255,255,.9) inset,0 12px 32px rgba(40,44,80,.07);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{position:relative;max-width:460px;margin:0 auto;min-height:100%;padding:0 20px calc(98px + env(safe-area-inset-bottom,0px));overflow:hidden;background:var(--bg)}
.app:before{content:"";position:absolute;width:420px;height:420px;right:-220px;top:-160px;border-radius:50%;background:var(--holo-strong);filter:blur(70px);opacity:.45;pointer-events:none}
@media(min-width:520px){body{background:#ECEEF5}.app{box-shadow:0 0 60px rgba(40,44,80,.08)}}

/* 頁首 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;margin:0 -20px;padding:14px 20px;background:rgba(246,247,251,.72);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-family:var(--latin);font-size:17px;font-weight:800;letter-spacing:.18em}
.brand span{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--mute);padding:3px 8px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.7)}
.back{display:none;width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:var(--white);font-size:18px;cursor:pointer}
.app.inner .back{display:grid;place-items:center}
.app.inner .brand span{display:none}

/* 共用 */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:var(--latin);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--violet)}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--holo-strong);box-shadow:0 0 0 3px rgba(122,107,255,.12)}
h1,h2,h3{font-weight:900;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--mute);font-size:14px;margin:8px 0 0}
.section{position:relative;margin-top:34px}
.section>h2{font-size:19px}
.section>.lead{margin-bottom:14px}
.cream{position:relative;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:var(--card)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border:0;border-radius:16px;cursor:pointer;font-weight:700;font-size:15px;background:var(--ink);color:#fff;box-shadow:0 10px 24px rgba(17,18,22,.18)}
.pill.ghost{background:var(--white);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.pill.line{background:#06C755;box-shadow:0 10px 22px rgba(6,199,85,.22)}
.pill.block{display:flex;width:100%}
.pill:focus-visible,.opt:focus-visible,.tool:focus-visible,.nav button:focus-visible,.keys button:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.small{font-size:12px;color:var(--mute);line-height:1.7}

/* 首頁 */
.hero{position:relative;padding:34px 2px 4px}
.hero h1{font-size:34px;line-height:1.22;margin-top:12px}
.hero h1 em{font-style:normal;background:var(--holo-strong);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .en{display:block;font-family:var(--latin);font-weight:300;font-size:13px;letter-spacing:.3em;color:var(--soft);margin-top:10px}
.jar{position:relative;width:100%;height:190px;margin:24px 0 4px;border-radius:26px;overflow:hidden;background:#0F1016}
.jar:before{content:"";position:absolute;width:210px;height:210px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 200deg,#B9ADFF,#9EDBFF,#FFB2D0,#FFE3A6,#B9ADFF);filter:blur(28px);opacity:.85;animation:spin 14s linear infinite}
.jar:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0 49%,rgba(255,255,255,.06) 50%,transparent 51%) 0 0/100% 18px,linear-gradient(90deg,transparent 0 49%,rgba(255,255,255,.06) 50%,transparent 51%) 0 0/18px 100%}
.jar span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;z-index:1}
.jar span b{font-family:var(--latin);font-size:46px;font-weight:300;letter-spacing:.04em;line-height:1}
.jar span small{font-family:var(--latin);font-size:10.5px;font-weight:700;letter-spacing:.32em;opacity:.8;margin-top:8px}
.jar i{position:absolute;left:0;right:0;height:2px;top:20%;z-index:1;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px #9EDBFF;animation:scanline 3.2s ease-in-out infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes scanline{0%,100%{top:16%}50%{top:82%}}
.tools{position:relative;display:grid;gap:10px;margin-top:20px}
.tool{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:15px;text-align:left;cursor:pointer;width:100%}
.tool .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--holo)}
.tool .ic svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block;font-size:16px;font-weight:700}
.tool small{display:block;color:var(--mute);font-size:12.5px;line-height:1.55}
.tool i{font-style:normal;color:var(--soft);font-family:var(--latin);font-size:18px}
.tool.first{background:#111216;color:#fff;border-color:#111216}
.tool.first small{color:rgba(255,255,255,.62)}
.tool.first .ic{background:var(--holo-strong)}
.tool.first i{color:rgba(255,255,255,.6)}
.tool.first .tag{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:6px;background:var(--holo-strong);color:#111;font-family:var(--latin);font-size:10px;font-weight:800;letter-spacing:.08em;vertical-align:2px}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys button{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.8);cursor:pointer;font-weight:700;font-size:14px}
.about{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center;padding:18px}
.about .av{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-family:var(--latin);font-size:24px;font-weight:800;color:#111;background:var(--holo-strong)}
.about b{font-size:15.5px}
.about p{margin:2px 0 0;font-size:13px;color:var(--mute);line-height:1.7}
.about .row{display:flex;gap:8px;grid-column:1/-1;margin-top:4px}
.about .row a{flex:1;padding:11px;font-size:13.5px}

/* 測驗 */
.quiz-head{position:relative;padding:24px 0 6px}
.quiz-head h2{font-size:25px;margin-top:8px}
.bar{position:relative;height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:18px 0 22px}
.bar i{display:block;height:100%;background:var(--holo-strong);transition:width .4s}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:0 0 6px}
.q-note{font-size:13px;color:var(--mute);margin:0 0 14px}
.opts{display:grid;gap:9px}
.opt{display:block;width:100%;text-align:left;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.85);cursor:pointer;font-size:15px;line-height:1.55;transition:transform .12s,border-color .2s,background .2s}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.age-pick{padding:24px;text-align:center}
.age-pick output{display:block;font-family:var(--latin);font-weight:300;font-size:72px;line-height:1}
.age-pick input{width:100%;accent-color:var(--ink);margin:16px 0 4px}
.qnav{display:flex;justify-content:space-between;margin-top:18px}
.qnav button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px;padding:6px 0}

/* 結果 */
.result{padding:26px 22px;text-align:center;margin-top:18px;overflow:hidden}
.result:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--holo-strong)}
.result .big{font-family:var(--latin);font-weight:300;font-size:84px;line-height:1;margin:12px 0 2px;letter-spacing:-.02em}
.result .big small{font-family:var(--sans);font-size:18px;font-weight:700;margin-left:4px}
.result h2{font-size:24px;margin-top:6px}
.result p{font-size:14px;color:var(--mute);margin:10px 0 0}
.compare{display:flex;justify-content:center;gap:8px;margin-top:14px}
.compare span{padding:6px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700}
.blk{margin-top:12px;padding:18px 20px}
.blk h3{font-size:16px;margin-bottom:8px}
.blk ul{margin:0;padding-left:1.1em}
.blk li{margin:4px 0;font-size:14px}
.blk li b{color:var(--violet)}
.routine{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.routine div{padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.routine b{font-size:13.5px}
.routine ol{margin:6px 0 0;padding-left:1.2em;font-size:13px;line-height:1.75}
.meters{display:grid;gap:12px;text-align:left}
.meter b{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.meter b span{font-family:var(--latin);font-size:17px;font-weight:600}
.meter .tr{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:5px}
.meter .tr i{display:block;height:100%;border-radius:99px;background:var(--holo-strong)}
.meter small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px;line-height:1.6}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-align:left;margin-bottom:16px}
.score .ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#7A6BFF var(--p),#ECEEF5 0)}
.score .ring span{width:84px;height:84px;border-radius:50%;display:grid;place-content:center;background:#fff;text-align:center}
.score .ring b{font-family:var(--latin);font-size:30px;font-weight:300;line-height:1}
.score .ring small{font-family:var(--latin);font-size:9px;font-weight:800;letter-spacing:.2em;color:var(--soft)}
.radar{display:block;width:100%;max-width:300px;margin:0 auto 14px}
.cta{margin-top:16px;padding:20px;text-align:center}
.cta h3{font-size:17px}
.cta p{font-size:13px;color:var(--mute);margin:6px 0 14px}
.disclaim{position:relative;margin-top:18px;font-size:11.5px;color:var(--soft);line-height:1.75;text-align:center}

/* 拍照 */
.cam{position:relative;margin-top:16px;border-radius:26px;overflow:hidden;background:#0F1016;aspect-ratio:3/4}
.cam video,.cam img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video{transform:scaleX(-1)}
.cam .mask{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 34% 30% at 50% 45%,transparent 98%,rgba(15,16,22,.6) 100%)}
.cam .oval{position:absolute;left:16%;right:16%;top:15%;height:60%;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none;box-shadow:0 0 30px rgba(158,219,255,.35)}
.cam:before,.cam:after{content:"";position:absolute;z-index:2;width:28px;height:28px;border:2px solid rgba(255,255,255,.9);pointer-events:none}
.cam:before{left:16px;top:16px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.cam:after{right:16px;bottom:16px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.cam .sweep{position:absolute;left:0;right:0;height:2px;z-index:2;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 20px #9EDBFF;animation:scanline 2.6s ease-in-out infinite;pointer-events:none}
.cam .hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:2}
.cam .idle{position:absolute;inset:0;display:grid;place-content:center;gap:10px;padding:24px;text-align:center;color:rgba(255,255,255,.7);background:radial-gradient(circle at 50% 42%,rgba(122,107,255,.35),transparent 60%),#0F1016}
.cam .idle b{font-family:var(--latin);font-size:13px;font-weight:800;letter-spacing:.3em;color:#fff}
.cam .busy{position:absolute;inset:0;z-index:3;display:grid;place-content:center;gap:8px;text-align:center;background:rgba(15,16,22,.45);color:#fff;font-family:var(--latin);font-size:12px;font-weight:800;letter-spacing:.3em}
.cam .mesh{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.cam .spot{position:absolute;z-index:2;transform:translate(-50%,-50%);border:1.5px solid rgba(255,255,255,.95);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;background:rgba(122,107,255,.18);text-shadow:0 1px 3px rgba(0,0,0,.5);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(158,219,255,.15)}}
.cam-btns{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tips{margin-top:12px;padding:16px 18px}
.tips ul{margin:6px 0 0;padding-left:1.1em;font-size:13.5px}
.privacy{position:relative;display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:#EEF7F3;color:#3E6B5C;font-size:12.5px;line-height:1.7}

/* 保養 */
.care{margin-top:10px;padding:0;overflow:hidden}
.care summary{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;list-style:none}
.care summary::-webkit-details-marker{display:none}
.care summary b{font-size:17px}
.care summary small{display:block;color:var(--mute);font-size:12.5px}
.care summary i{margin-left:auto;font-style:normal;font-family:var(--latin);color:var(--soft);transition:transform .2s}
.care[open] summary i{transform:rotate(45deg)}
.care .body{padding:0 18px 18px}
.care ol{margin:0;padding-left:1.2em;font-size:14px}
.care ol li{margin:6px 0}
.care .k{min-width:62px;font-family:var(--latin);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 8px;border-radius:9px;background:var(--holo);text-align:center}

/* 底部導覽 */
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:30;width:min(460px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(246,247,251,.82);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.nav button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--soft);cursor:pointer;padding:4px 0}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--ink)}
.view{position:relative;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){.view,.jar:before,.jar i,.cam .sweep,.cam .spot{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="back" id="back" aria-label="回上一頁">‹</button>
    <div class="brand"><b>WINNIFER</b><span>SKIN LAB</span></div>
    <span style="width:36px"></span>
  </header>
  <main id="main"></main>
</div>

<nav class="nav" id="nav" aria-label="主選單">
  <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>首頁</button>
  <button data-go="scan"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>拍照測</button>
  <button data-go="tests"><svg viewBox="0 0 24 24"><path d="M7 4h10v16H7z"/><path d="M10 8h4M10 12h4M10 16h2"/></svg>測驗</button>
  <button data-go="care"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>保養</button>
</nav>

<script>
(() => {
  // ── 設定：溫妮佛的 LINE 官方帳號連結（還沒有的話留空，按鈕會改成 IG）──
  const LINE_URL = '';
  const IG_URL = 'https://www.instagram.com/hiwinnifer';
  const $ = s => document.querySelector(s);
  const main = $('#main'), app = $('#app');
  let 歷史 = [];

  const icon = {
    cam: '<svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>',
    drop: '<svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>'
  };
  const 聯絡鈕 = (文 = '加 LINE 領完整保養建議') => LINE_URL
    ? `<a class="pill line block" href="${LINE_URL}" target="_blank" rel="noopener">${文}</a>`
    : `<a class="pill block" href="${IG_URL}" target="_blank" rel="noopener">到 IG 私訊溫妮佛「保養」</a>`;

  // ── 畫面切換 ──
  function go(name, 參 = {}, 推 = true) {
    if (推) 歷史.push(name);
    app.classList.toggle('inner', !['home', 'tests', 'care', 'scan'].includes(name));
    document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.dataset.go === name || (name.startsWith('quiz') && b.dataset.go === 'tests')));
    停相機();
    main.innerHTML = ''; const v = document.createElement('div'); v.className = 'view'; main.append(v);
    views[name](v, 參);
    scrollTo({ top: 0 });
  }
  $('#back').onclick = () => { 歷史.pop(); go(歷史.pop() || 'home'); };
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { 歷史 = []; go(b.dataset.go); });

  // ═════════════ 首頁 ═════════════
  const views = {};
  views.home = v => {
    v.innerHTML = `
      <section class="hero">
        <span class="eyebrow">AI Skin Lab · 30+</span>
        <h1>今天的妳<br>皮膚<em>幾歲</em>了？</h1>
        <span class="en">KNOW YOUR SKIN FIRST</span>
        <div class="jar" aria-hidden="true"><i></i><span><b>SKIN</b><small>SCAN · TYPE · AGE</small></span></div>
        <p class="lead">30 歲之後，保養不是越多越好 ~ 先看懂自己的皮膚，再對症照顧</p>

        串流 = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 1706 } }, audio: false });
        const vid = document.createElement('video'); vid.playsInline = true; vid.muted = true; vid.srcObject = 串流; vid.id = 'vid';
        cam.prepend(vid); await vid.play();
        v.querySelector('#idle').hidden = true; v.querySelector('#hint').hidden = false; const sw = document.createElement('i'); sw.className = 'sweep'; cam.append(sw);
        v.querySelector('#openCam').textContent = '拍照分析';
        模型();   // 先在背景準備辨識臉部的工具
      } catch (e) { alert2(v, '打不開鏡頭 ~ 請允許使用相機，或改用「上傳照片」'); }
    };
    v.querySelector('#upload').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const img = new Image(); img.onload = () => 分析(v, img, false); img.src = URL.createObjectURL(f);
    };
  };
  function alert2(v, t) { const p = document.createElement('p'); p.className = 'privacy'; p.style.background = '#FBEDE8'; p.style.color = '#9A5A4A'; p.textContent = t; v.querySelector('.cam-btns').after(p); setTimeout(() => p.remove(), 6000); }
  function 拍(v) {
    const vid = v.querySelector('#vid'); if (!vid) return;
    const c = document.createElement('canvas'); c.width = vid.videoWidth; c.height = vid.videoHeight;
    const g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(vid, 0, 0);
    停相機(); 分析(v, c, true);
  }

  // 辨識臉部位置的工具（Google MediaPipe，在手機上執行）
  let 臉模型 = null, 載入中 = null;
  function 模型() {
    if (載入中) return 載入中;
    載入中 = (async () => {
      try {
        const m = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
        const fs = await m.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
        臉模型 = await m.FaceLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' }, runningMode: 'IMAGE', numFaces: 1 });
      } catch (e) { 臉模型 = null; }
      return 臉模型;
    })();
    return 載入中;
  }

  async function 分析(v, 圖, 從鏡頭) {
    const cam = v.querySelector('#cam');
    cam.querySelector('#vid')?.remove(); cam.querySelector('#idle').hidden = true; v.querySelector('#hint').hidden = true;
    const shot = document.createElement('img'); shot.className = 'shot'; shot.src = 圖 instanceof HTMLCanvasElement ? 圖.toDataURL('image/jpeg', .9) : 圖.src; cam.prepend(shot);
    const busy = document.createElement('div'); busy.className = 'busy'; busy.innerHTML = '<span>ANALYZING</span><span style="font-family:var(--sans);letter-spacing:.05em;font-weight:500;font-size:13px">正在分析妳的膚況</span>'; cam.append(busy); const sw = document.createElement('i'); sw.className = 'sweep'; cam.append(sw);
    // 縮成固定大小再算，速度和結果比較穩定
    const W = 720, H = Math.round((圖.naturalHeight || 圖.height) / (圖.naturalWidth || 圖.width) * W);
    const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(圖, 0, 0, W, H);
    await 模型();
    let 區 = null, 找到臉 = false, 網格 = null;
    if (臉模型) {
      try {
        const r = 臉模型.detect(c);
        const L = r.faceLandmarks && r.faceLandmarks[0];
        if (L) {
          找到臉 = true; 網格 = L.map(q => [q.x * W, q.y * H]);
          const P = i => [L[i].x * W, L[i].y * H];
          const 臉寬 = Math.hypot(P(454)[0] - P(234)[0], P(454)[1] - P(234)[1]);
          const s = 臉寬 * .13;
          const mid = (a, b) => [(P(a)[0] + P(b)[0]) / 2, (P(a)[1] + P(b)[1]) / 2];
          區 = { 額頭: [mid(10, 151), s * 1.2], 左頰: [P(50), s], 右頰: [P(280), s], 鼻子: [P(4), s * .6], 下巴: [P(199), s * .8], 臉寬 };
        }
      } catch (e) {}
    }
    if (!區) {   // 找不到臉：照虛線框的位置估
      const cx = W / 2, cy = H * .45, rx = W * .34, ry = H * .3, s = rx * .26;
      區 = { 額頭: [[cx, cy - ry * .55], s * 1.2], 左頰: [[cx - rx * .5, cy + ry * .12], s], 右頰: [[cx + rx * .5, cy + ry * .12], s], 鼻子: [[cx, cy + ry * .05], s * .6], 下巴: [[cx, cy + ry * .75], s * .8], 臉寬: rx * 2 };
    }
    const 結果 = 計算(g, 區, W, H);
    busy.remove();
    // 拍完：拿掉虛線框，在臉上畫出偵測到的網格點和分析的位置
    cam.querySelector('.mask')?.remove(); cam.querySelector('.oval')?.remove(); cam.querySelectorAll('.sweep').forEach(e => e.remove());
    const 寬 = cam.clientWidth, 高 = cam.clientHeight, 比 = Math.max(寬 / W, 高 / H), 偏x = (W * 比 - 寬) / 2, 偏y = (H * 比 - 高) / 2;
    if (網格) {
      const m = document.createElement('canvas'); m.className = 'mesh'; m.width = 寬 * 2; m.height = 高 * 2; cam.append(m);
      const mg = m.getContext('2d'); mg.scale(2, 2); mg.fillStyle = 'rgba(220,240,255,.85)'; mg.shadowColor = '#9EDBFF'; mg.shadowBlur = 4;
      網格.forEach(([x, y], n) => { if (n % 3) return; mg.beginPath(); mg.arc(x * 比 - 偏x, y * 比 - 偏y, .9, 0, 7); mg.fill(); });
    }
    for (const k of ['額頭', '左頰', '右頰', '鼻子', '下巴']) {
      const [[x, y], r] = 區[k], d = document.createElement('span');
      d.className = 'spot'; d.textContent = k === '左頰' || k === '右頰' ? '臉頰' : k;
      d.style.left = (x * 比 - 偏x) + 'px'; d.style.top = (y * 比 - 偏y) + 'px'; d.style.width = d.style.height = Math.max(26, r * 2 * 比) + 'px';
      cam.append(d);
    }
    畫結果(v, 結果, 找到臉, 從鏡頭);
  }

  // ── 把每一塊皮膚的顏色換成 Lab 再算指標 ──
  function lab(r, g, b) {
    const f = c => { c /= 255; return c > .04045 ? Math.pow((c + .055) / 1.055, 2.4) : c / 12.92; };
    const R = f(r), G = f(g), B = f(b);
    let x = (R * .4124 + G * .3576 + B * .1805) / .95047, y = R * .2126 + G * .7152 + B * .0722, z = (R * .0193 + G * .1192 + B * .9505) / 1.08883;
    const h = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
    x = h(x); y = h(y); z = h(z);
    return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
  }
  function 取塊(g, [[cx, cy], s], W, H) {
    const x0 = Math.max(0, Math.round(cx - s)), y0 = Math.max(0, Math.round(cy - s)), w = Math.min(W - x0, Math.round(s * 2)), h = Math.min(H - y0, Math.round(s * 2));
    if (w < 6 || h < 6) return null;
    const d = g.getImageData(x0, y0, w, h).data, px = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = (y * w + x) * 4; px.push(lab(d[i], d[i + 1], d[i + 2])); }
    const 平均 = k => px.reduce((s, p) => s + p[k], 0) / px.length;
    const L = 平均(0), A = 平均(1), B = 平均(2);
    const 標準差 = Math.sqrt(px.reduce((s, p) => s + (p[0] - L) ** 2, 0) / px.length);
    // 細紋與毛孔：亮度的細小變化（拉普拉斯）
    let lap = 0, n = 0;
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const c = px[y * w + x][0], v = 4 * c - px[(y - 1) * w + x][0] - px[(y + 1) * w + x][0] - px[y * w + x - 1][0] - px[y * w + x + 1][0];
      lap += v * v; n++;
    }
    const 亮點 = px.filter(p => p[0] > L + 2.2 * 標準差 && p[0] > 70 && Math.hypot(p[1], p[2]) < 22).length / px.length;
    return { L, A, B, 標準差, 紋理: Math.sqrt(lap / Math.max(1, n)), 亮點 };
  }
  function 計算(g, 區, W, H) {
    const 塊 = {}; for (const k of ['額頭', '左頰', '右頰', '鼻子', '下巴']) 塊[k] = 取塊(g, 區[k], W, H);
    const 有 = Object.values(塊).filter(Boolean);
    const avg = (arr, f) => arr.reduce((s, x) => s + f(x), 0) / arr.length;
    const 頰 = [塊.左頰, 塊.右頰].filter(Boolean), T = [塊.額頭, 塊.鼻子].filter(Boolean);
    const L平均 = avg(有, x => x.L);
    const 夾 = x => Math.round(Math.max(5, Math.min(98, x)));
    const 透亮 = 夾((L平均 - 42) / 30 * 100);
    const 塊間差 = Math.sqrt(avg(有, x => (x.L - L平均) ** 2));
    const 均勻 = 夾(100 - (avg(有, x => x.標準差) * 6 + 塊間差 * 3.5));
    const 泛紅 = 夾((avg(頰, x => x.A) - (塊.額頭 ? 塊.額頭.A : avg(有, x => x.A)) + 1.5) / 8 * 100 + (avg(頰, x => x.A) - 12) * 3);
    const 油光 = 夾(avg(T, x => x.亮點) * 900);
    const 細緻 = 夾(100 - (avg(頰, x => x.紋理) / Math.max(20, L平均) * 100 - 8) * 7);
    return { 透亮, 均勻, 泛紅, 油光, 細緻, 光線: L平均 };
  }
  function 畫結果(v, r, 找到臉, 從鏡頭) {
    const 光 = r.光線 < 38 ? '光線有點暗，結果可能偏暗沉 ~ 面向窗戶再拍一次會更準' : r.光線 > 82 ? '光線太亮，可能看不出細節 ~ 避開直射的強光再拍一次' : '';
    const 指標 = [
      ['透亮度', r.透亮, r.透亮 >= 65 ? '氣色很好，看起來很有光澤' : r.透亮 >= 45 ? '還不錯，睡飽一點會更亮' : '有點暗沉，可能是疲勞或缺水'],
      ['均勻度', r.均勻, r.均勻 >= 65 ? '膚色很均勻' : r.均勻 >= 45 ? '有一點點不均，可能是斑點或痘印' : '膚色比較不均，防曬要更認真'],
      ['泛紅', r.泛紅, r.泛紅 <= 35 ? '很穩定，沒有明顯泛紅' : r.泛紅 <= 60 ? '臉頰有一點紅，可能是比較敏感' : '臉頰偏紅，保養品要選溫和的'],
      ['油光', r.油光, r.油光 <= 35 ? '油水平衡' : r.油光 <= 60 ? 'T 字有一點油光' : 'T 字出油比較明顯'],
      ['細緻度', r.細緻, r.細緻 >= 65 ? '皮膚很細緻' : r.細緻 >= 45 ? '毛孔或細紋有一點點' : '毛孔或細紋比較明顯，保濕要加強'],
    ];
    const 重點 = 指標.filter(([k, s]) => (k === '泛紅' || k === '油光') ? s > 55 : s < 50).map(x => x[0]);
    const 建議 = { 透亮度: '睡飽、多喝水，早上用溫和的去角質讓氣色亮起來', 均勻度: '每天防曬，陰天也擦 ~ 這是讓膚色均勻最重要的一步', 泛紅: '選成分單純、無香精的保養品，洗臉用溫水', 油光: 'T 字用清爽的保濕，不要為了控油過度清潔', 細緻度: '化妝水後一定要鎖水，晚上可以敷保濕面膜' };
    const box = document.createElement('div');
    const 分 = Math.round((r.透亮 + r.均勻 + (100 - r.泛紅) + (100 - r.油光) + r.細緻) / 5);
    const 軸 = [['透亮', r.透亮], ['均勻', r.均勻], ['穩定', 100 - r.泛紅], ['清爽', 100 - r.油光], ['細緻', r.細緻]];
    const 點 = (i, k) => { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; return [150 + Math.cos(a) * 92 * k, 128 + Math.sin(a) * 92 * k]; };
    const 環 = k => 軸.map((_, i) => 點(i, k).join(',')).join(' ');
    const 雷達 = `<svg class="radar" viewBox="0 0 300 262" role="img" aria-label="膚況雷達圖">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9ADFF" stop-opacity=".75"/><stop offset=".5" stop-color="#9EDBFF" stop-opacity=".6"/><stop offset="1" stop-color="#FFB2D0" stop-opacity=".7"/></linearGradient></defs>
      ${[.25, .5, .75, 1].map(k => `<polygon points="${環(k)}" fill="none" stroke="#E3E5EE" stroke-width="1"/>`).join('')}
      ${軸.map((_, i) => `<line x1="150" y1="128" x2="${點(i, 1)[0]}" y2="${點(i, 1)[1]}" stroke="#E3E5EE"/>`).join('')}
      <polygon points="${軸.map(([, v], i) => 點(i, Math.max(.06, v / 100)).join(',')).join(' ')}" fill="url(#rg)" stroke="#7A6BFF" stroke-width="1.5"/>
      ${軸.map(([k, v], i) => { const [x, y] = 點(i, 1.2); return `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#111216">${k} <tspan fill="#7A6BFF" font-family="Manrope">${v}</tspan></text>`; }).join('')}
    </svg>`;
    box.innerHTML = `<div class="result cream" style="text-align:left">
        <span class="eyebrow">Today's skin</span>
        <div class="score" style="margin-top:12px"><div class="ring" style="--p:${分}%"><span><b>${分}</b><small>SCORE</small></span></div><div><h2 style="font-size:21px">今天的膚況</h2><p style="margin-top:4px">${分 >= 75 ? '狀態很好，繼續保持' : 分 >= 55 ? '還不錯，有幾個地方可以多照顧' : '今天皮膚有點累，給它多一點保濕和休息'}</p></div></div>
        ${雷達}
        <div class="meters">${指標.map(([k, s, t]) => `<div class="meter"><b>${k}<span>${s}</span></b><div class="tr"><i style="width:${s}%"></i></div><small>${t}</small></div>`).join('')}</div>
        ${光 ? `<p class="privacy" style="background:#FBF3E6;color:#8A6A3A">💡 ${光}</p>` : ''}
        ${!找到臉 ? '<p class="privacy" style="background:#FBF3E6;color:#8A6A3A">💡 沒有偵測到完整的臉，是照虛線框的位置估算的 ~ 正面、臉放進框裡再拍一次會更準</p>' : ''}
      </div>
      <div class="blk cream"><h3>${重點.length ? '今天可以多照顧的地方' : '今天的皮膚狀態很好'}</h3><ul>${(重點.length ? 重點 : ['均勻度']).slice(0, 3).map(k => `<li><b>${k}</b> ~ ${重點.length ? 建議[k] : '繼續保持防曬和保濕，就是最好的保養'}</li>`).join('')}</ul></div>
      <div class="cta cream"><h3>想知道該用什麼保養？</h3><p>把這份結果截圖傳給溫妮佛，幫妳看看下一步</p>${聯絡鈕('加 LINE 問溫妮佛')}</div>
      <div class="cam-btns"><button class="pill ghost" id="again">再拍一次</button><button class="pill ghost" id="toAge">測肌膚年齡</button></div>
      <p class="disclaim">膚況分析只在妳的手機上計算，受光線和鏡頭影響，是生活保養的參考，不是醫療檢測 ~ 有皮膚問題請找皮膚科醫師</p>`;
    v.querySelectorAll(':scope > .privacy, :scope > .tips').forEach(e => e.remove());
    v.querySelector('.cam-btns').replaceWith(box);
    box.querySelector('#again').onclick = () => go('scan', {}, false);
    box.querySelector('#toAge').onclick = () => go('quiz-age');
    box.scrollIntoView({ behavior: 'smooth' });
  }

  // ═════════════ 保養 ═════════════
  const 關心們 = [

    { id: 'young', 名: '凍齡', 英: 'Ageless', 說: '讓皮膚看起來比實際年齡年輕', 招: ['防曬是最划算的凍齡保養，陰天也要擦', '睡滿 7 小時，12 點前上床', '少糖，含糖飲料是皮膚老化的推手', '固定的保養習慣，比偶爾用很貴的產品更有用'] },
    { id: 'anti', 名: '抗老', 英: 'Anti-aging', 說: '細紋、法令紋、眼周的日常照顧', 招: ['眼霜用無名指輕點，不要拉扯眼周', '法令紋按摩先打開周圍的穴位，不要直接用力推', '晚上的保養可以加入抗老精華，從低濃度開始', '多做表情沒關係，但記得表情後要保濕'] },

  ];
  views.care = (v, 參 = {}) => {
    v.innerHTML = `<div class="quiz-head"><span class="eyebrow">Daily care</span><h2>溫妮佛的養美重點</h2><p class="lead">30+ 女生最在意的五件事，每天做一點點</p></div>
      ${關心們.map(c => `<details class="care cream" id="care-${c.id}" ${參.open === c.id ? 'open' : ''}><summary><span class="k">${c.英}</span><span><b>${c.名}</b><small>${c.說}</small></span><i>＋</i></summary><div class="body"><ol>${c.招.map(x => `<li>${x}</li>`).join('')}</ol></div></details>`).join('')}
      <div class="cta cream"><h3>想看溫妮佛示範？</h3><p>臉部按摩、法令紋、提拉手法，IG 上都有影片</p><a class="pill ghost block" href="${IG_URL}" target="_blank" rel="noopener">看溫妮佛的按摩影片</a><div style="height:10px"></div>${LINE_URL ? 聯絡鈕('加 LINE 問保養問題') : ''}</div>
      <p class="disclaim">以上是日常保養分享，不是醫療建議 ~ 有皮膚問題請找皮膚科醫師</p>`;
    if (參.open) setTimeout(() => document.getElementById('care-' + 參.open)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
  };

  go('home');
})();
