<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EE">
<title>Winnifer 養美研究室</title>
<meta name="description" content="溫妮佛的 30+ 養美小工具：拍照看看今天的膚況、測出你的膚質、算算你的肌膚年齡 再給你一份適合你的保養重點">
<meta property="og:type" content="website">
<meta property="og:title" content="Winnifer 養美研究室｜你的皮膚 現在幾歲？">
<meta property="og:description" content="拍照看膚況・膚質測驗・肌膚年齡 ~ 30+ 女生的養美日常">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap">
<style>
/* 科技時尚・韓系：冷白、全像漸層、黑色重點 ~ 刻意只有一套淺色 */
:root{
  --bg:#F7F3EE; --white:#FFFFFF; --ink:#3A3435; --mute:#7A7178; --soft:#ACA4AC; --line:rgba(58,52,53,.09); --wine:#765151; --gold:#B89A72; --lav:#EAE4ED;
  --violet:#8C7898; --pink:#D8CFDD; --ice:#EAE4ED; --mint:#D8C7A8;
  --holo:linear-gradient(125deg,#FFFFFF 0%,#F1ECF3 42%,#EAE4ED 70%,#F7F3EE 100%);
  --holo-strong:linear-gradient(125deg,#B7A6C2 0%,#EAE4ED 38%,#DCCBAE 72%,#B89A72 100%);
  --sans:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif; --latin:"Manrope","Helvetica Neue",Arial,sans-serif;
  --card:0 1px 0 rgba(255,255,255,.95) inset,0 14px 34px rgba(80,62,92,.08);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{position:relative;max-width:460px;margin:0 auto;min-height:100%;padding:0 20px calc(98px + env(safe-area-inset-bottom,0px));overflow-x:clip;background:var(--bg)}
.app:before{content:"";position:absolute;width:420px;height:420px;right:-220px;top:-160px;border-radius:50%;background:var(--holo-strong);filter:blur(70px);opacity:.45;pointer-events:none}
@media(min-width:520px){body{background:#ECE6EE}.app{box-shadow:0 0 60px rgba(80,62,92,.08)}}

/* 頁首 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;margin:0 -20px;padding:14px 20px;background:rgba(246,247,251,.72);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-family:var(--latin);font-size:17px;font-weight:800;letter-spacing:.18em}
.brand span{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--mute);padding:3px 8px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.7)}
.back{display:none;width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:var(--white);font-size:18px;cursor:pointer}
.app.inner .back{display:grid;place-items:center}
.app.inner .brand span{display:none}

/* 共用 */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-family:var(--latin);font-size:11px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--violet)}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--holo-strong);box-shadow:0 0 0 3px rgba(140,120,152,.16)}
h1,h2,h3{font-weight:900;margin:0;letter-spacing:-.01em;text-wrap:balance}
.lead{color:var(--mute);font-size:14px;margin:8px 0 0}
.section{position:relative;margin-top:34px}
.section>h2{font-size:19px}
.section>.lead{margin-bottom:14px}
.cream{position:relative;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:var(--card)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border:0;border-radius:16px;cursor:pointer;font-weight:700;font-size:15px;background:linear-gradient(180deg,#86605F,#765151);color:#fff;box-shadow:0 10px 24px rgba(118,81,81,.24)}
.pill.ghost{background:var(--white);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.pill.line{background:#06C755;box-shadow:0 10px 22px rgba(6,199,85,.22)}
.pill.block{display:flex;width:100%}
.pill:focus-visible,.opt:focus-visible,.tool:focus-visible,.nav button:focus-visible,.keys button:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.small{font-size:12px;color:var(--mute);line-height:1.7}

/* 首頁 */
.hero{position:relative;padding:34px 2px 4px}
.hero h1{font-size:34px;line-height:1.22;margin-top:12px}
.hero h1 em{font-style:normal;background:linear-gradient(120deg,#8C7898,#A88BA8 50%,#B89A72);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .en{display:block;font-family:var(--latin);font-weight:300;font-size:13px;letter-spacing:.3em;color:var(--soft);margin-top:10px}
.jar{position:relative;width:100%;height:190px;margin:24px 0 4px;border-radius:26px;overflow:hidden;background:linear-gradient(150deg,#5A4D62,#2F2A30)}
.jar:before{content:"";position:absolute;width:210px;height:210px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 200deg,#B7A6C2,#F4EFF6,#DCCBAE,#8C7898,#B7A6C2);filter:blur(28px);opacity:.85;animation:spin 14s linear infinite}
.jar:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 0 49%,rgba(255,255,255,.06) 50%,transparent 51%) 0 0/100% 18px,linear-gradient(90deg,transparent 0 49%,rgba(255,255,255,.06) 50%,transparent 51%) 0 0/18px 100%}
.jar span{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#fff;z-index:1}
.jar span b{font-family:var(--latin);font-size:46px;font-weight:300;letter-spacing:.04em;line-height:1}
.jar span small{font-family:var(--latin);font-size:10.5px;font-weight:700;letter-spacing:.32em;opacity:.8;margin-top:8px}
.jar i{position:absolute;left:0;right:0;height:2px;top:20%;z-index:1;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px #CDBEE0;animation:scanline 3.2s ease-in-out infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes scanline{0%,100%{top:16%}50%{top:82%}}
.tools{position:relative;display:grid;gap:10px;margin-top:20px}
.tool{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:15px;text-align:left;cursor:pointer;width:100%}
.tool .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--holo)}
.tool .ic svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block;font-size:16px;font-weight:700}
.tool small{display:block;color:var(--mute);font-size:12.5px;line-height:1.55}
.tool i{font-style:normal;color:var(--soft);font-family:var(--latin);font-size:18px}
.tool.first{background:linear-gradient(140deg,#8C7898,#5E5066);color:#fff;border-color:#7B6886}
.tool.first small{color:rgba(255,255,255,.62)}
.tool.first .ic{background:var(--holo-strong)}
.tool.first i{color:rgba(255,255,255,.6)}
.tool.first .tag{display:inline-block;margin-left:7px;padding:1px 8px;border-radius:6px;background:var(--holo-strong);color:#111;font-family:var(--latin);font-size:10px;font-weight:800;letter-spacing:.08em;vertical-align:2px}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys button{padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.8);cursor:pointer;font-weight:700;font-size:14px}
.about{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center;padding:18px}
.about .av{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-family:var(--latin);font-size:24px;font-weight:800;color:#111;background:var(--holo-strong)}
.about b{font-size:15.5px}
.about p{margin:2px 0 0;font-size:13px;color:var(--mute);line-height:1.7}
.about .row{display:flex;gap:8px;grid-column:1/-1;margin-top:4px}
.about .row a{flex:1;padding:11px;font-size:13.5px}

/* 測驗 */
.quiz-head{position:relative;padding:24px 0 6px}
.quiz-head h2{font-size:25px;margin-top:8px}
.bar{position:relative;height:3px;border-radius:99px;background:var(--line);overflow:hidden;margin:18px 0 22px}
.bar i{display:block;height:100%;background:var(--holo-strong);transition:width .4s}
.q{font-size:19px;font-weight:700;line-height:1.55;margin:0 0 6px}
.q-note{font-size:13px;color:var(--mute);margin:0 0 14px}
.opts{display:grid;gap:9px}
.opt{display:block;width:100%;text-align:left;padding:15px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.85);cursor:pointer;font-size:15px;line-height:1.55;transition:transform .12s,border-color .2s,background .2s}
.opt:active{transform:scale(.985)}
.opt.on{border-color:var(--violet);background:var(--violet);color:#fff}
.age-pick{padding:24px;text-align:center}
.age-pick output{display:block;font-family:var(--latin);font-weight:300;font-size:72px;line-height:1}
.age-pick input{width:100%;accent-color:var(--violet);margin:16px 0 4px}
.qnav{display:flex;justify-content:space-between;margin-top:18px}
.qnav button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px;padding:6px 0}

/* 結果 */
.result{padding:26px 22px;text-align:center;margin-top:18px;overflow:hidden}
.result:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--holo-strong)}
.result .big{font-family:var(--latin);font-weight:300;font-size:84px;line-height:1;margin:12px 0 2px;letter-spacing:-.02em}
.result .big small{font-family:var(--sans);font-size:18px;font-weight:700;margin-left:4px}
.result h2{font-size:24px;margin-top:6px}
.result p{font-size:14px;color:var(--mute);margin:10px 0 0}
.compare{display:flex;justify-content:center;gap:8px;margin-top:14px}
.compare span{padding:6px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:700}
.blk{margin-top:12px;padding:18px 20px}
.blk h3{font-size:16px;margin-bottom:8px}
.blk ul{margin:0;padding-left:1.1em}
.blk li{margin:4px 0;font-size:14px}
.blk li b{color:var(--violet)}
.routine{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.routine div{padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.routine b{font-size:13.5px}
.routine ol{margin:6px 0 0;padding-left:1.2em;font-size:13px;line-height:1.75}
.meters{display:grid;gap:12px;text-align:left}
.meter b{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.meter b span{font-family:var(--latin);font-size:17px;font-weight:600}
.meter .tr{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:5px}
.meter .tr i{display:block;height:100%;border-radius:99px;background:var(--holo-strong)}
.meter small{display:block;color:var(--mute);font-size:12.5px;margin-top:3px;line-height:1.6}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;text-align:left;margin-bottom:16px}
.score .ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#8C7898 0,#B89A72 var(--p),#EAE4ED 0)}
.score .ring span{width:84px;height:84px;border-radius:50%;display:grid;place-content:center;background:#fff;text-align:center}
.score .ring b{font-family:var(--latin);font-size:30px;font-weight:300;line-height:1}
.score .ring small{font-family:var(--latin);font-size:9px;font-weight:800;letter-spacing:.2em;color:var(--soft)}
.radar{display:block;width:100%;max-width:300px;margin:0 auto 14px}
.cta{margin-top:16px;padding:20px;text-align:center}
.cta h3{font-size:17px}
.cta p{font-size:13px;color:var(--mute);margin:6px 0 14px}
.disclaim{position:relative;margin-top:18px;font-size:11.5px;color:var(--soft);line-height:1.75;text-align:center}

/* 拍照 */
.cam{position:relative;margin-top:16px;border-radius:26px;overflow:hidden;background:#2F2A30;aspect-ratio:3/4}
.cam video,.cam img.shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam video{transform:scaleX(-1)}
.cam .mask{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 34% 30% at 50% 45%,transparent 98%,rgba(47,42,48,.6) 100%)}
.cam .oval{position:absolute;left:16%;right:16%;top:15%;height:60%;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;pointer-events:none;box-shadow:0 0 30px rgba(158,219,255,.35)}
.cam:before,.cam:after{content:"";position:absolute;z-index:2;width:28px;height:28px;border:2px solid rgba(255,255,255,.9);pointer-events:none}
.cam:before{left:16px;top:16px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.cam:after{right:16px;bottom:16px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.cam .sweep{position:absolute;left:0;right:0;height:2px;z-index:2;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 20px #CDBEE0;animation:scanline 2.6s ease-in-out infinite;pointer-events:none}
.cam .hint{position:absolute;left:0;right:0;bottom:18px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5);z-index:2}
.cam .idle{position:absolute;inset:0;display:grid;place-content:center;gap:10px;padding:24px;text-align:center;color:rgba(255,255,255,.7);background:radial-gradient(circle at 50% 42%,rgba(140,120,152,.4),transparent 60%),#2F2A30}
.cam .idle b{font-family:var(--latin);font-size:13px;font-weight:800;letter-spacing:.3em;color:#fff}
.cam .busy{position:absolute;inset:0;z-index:3;display:grid;place-content:center;gap:8px;text-align:center;background:rgba(47,42,48,.45);color:#fff;font-family:var(--latin);font-size:12px;font-weight:800;letter-spacing:.3em}
.cam .mesh{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.cam .spot{position:absolute;z-index:2;transform:translate(-50%,-50%);border:1.5px solid rgba(255,255,255,.95);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700;background:rgba(183,166,194,.28);text-shadow:0 1px 3px rgba(0,0,0,.5);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(183,166,194,.28)}}
.cam-btns{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tips{margin-top:12px;padding:16px 18px}
.tips ul{margin:6px 0 0;padding-left:1.1em;font-size:13.5px}
.privacy{position:relative;display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:#F1EDF3;color:#5F5168;font-size:12.5px;line-height:1.7}

/* 保養 */
.care{margin-top:10px;padding:0;overflow:hidden}
.care summary{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;list-style:none}
.care summary::-webkit-details-marker{display:none}
.care summary b{font-size:17px}
.care summary small{display:block;color:var(--mute);font-size:12.5px}
.care summary i{margin-left:auto;font-style:normal;font-family:var(--latin);color:var(--soft);transition:transform .2s}
.care[open] summary i{transform:rotate(45deg)}
.care .body{padding:0 18px 18px}
.care ol{margin:0;padding-left:1.2em;font-size:14px}
.care ol li{margin:6px 0}
.care .k{min-width:62px;font-family:var(--latin);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 8px;border-radius:9px;background:var(--holo);text-align:center}

/* 第一屏 */
.hero1{position:relative;margin:0 -20px;display:flex;flex-direction:column;overflow:hidden}
.first-img{position:relative;height:min(520px,62svh);background:
  linear-gradient(180deg,rgba(247,243,238,0) 40%,rgba(247,243,238,.9) 82%,#F7F3EE 100%),
  linear-gradient(105deg,transparent 0 30%,rgba(255,255,255,.55) 30% 33%,transparent 33% 46%,rgba(255,255,255,.45) 46% 49%,transparent 49%),
  radial-gradient(120% 80% at 75% 20%,#FFFFFF 0,#F4EFEA 45%,#E9E1E7 100%)}
.first-img.has{background:linear-gradient(180deg,rgba(247,243,238,0) 78%,#F7F3EE 100%),var(--photo) center 40%/cover no-repeat}
.first-txt{position:relative;padding:4px 24px 8px;width:100%;margin-top:-34px}
.hero1 h1{font-size:38px;line-height:1.25;font-weight:900;letter-spacing:.02em}
.hero1 p{margin:12px 0 20px;font-size:14.5px;color:var(--mute);letter-spacing:.06em}
.hero1 .pill{padding:15px 26px;font-size:15.5px}
.app.is-home .top{background:rgba(247,243,238,.5)}
.belief{position:relative;margin:34px 0 0;padding:30px 24px;text-align:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.belief p{margin:14px 0 0;font-size:19px;line-height:1.9;font-weight:500;color:var(--ink)}
.belief p b{font-weight:900;background:linear-gradient(120deg,#8C7898,#B89A72);-webkit-background-clip:text;background-clip:text;color:transparent}
.belief .sig{display:block;margin-top:12px;font-family:var(--latin);font-size:12px;letter-spacing:.2em;color:var(--soft)}
.doors{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.doors button{display:grid;justify-items:start;gap:2px;padding:16px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.9);background:linear-gradient(160deg,#FFFFFF,#F1ECF3);box-shadow:var(--card);text-align:left;cursor:pointer;min-height:150px}
.doors .n{font-family:var(--latin);font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--gold)}
.doors b{font-size:16px;font-weight:900;margin-top:16px}
.doors small{font-family:var(--latin);font-size:11px;letter-spacing:.18em;color:var(--violet);text-transform:uppercase}
.doors i{font-style:normal;font-size:11.5px;line-height:1.5;color:var(--mute);margin-top:8px}
.doors button:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.wall{padding:16px 18px}
.wall b{font-size:15px}
.wall p{margin:4px 0 0;font-size:13px;color:var(--mute)}
/* 自測清單＋臉部圖 */
.face-wrap{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start}
.face{width:120px;position:sticky;top:76px}
.face svg{width:100%;display:block}
.face .z{opacity:0;transition:opacity .25s}
.face .z.on{opacity:1}
.checks{display:grid;gap:8px}
.chk{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:12px 13px;border-radius:14px;border:1px solid var(--line);background:rgba(255,253,250,.9);cursor:pointer;text-align:left;width:100%}
.chk .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--soft);display:grid;place-items:center;font-size:13px;color:transparent;margin-top:1px}
.chk.on{border-color:var(--violet);background:#F6F2F8}
.chk.on .box{background:var(--violet);border-color:var(--violet);color:#fff}
.chk b{display:block;font-size:14.5px}
.chk small{display:block;color:var(--mute);font-size:12px;line-height:1.55}
.tagx{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;font-size:10px;font-weight:700;vertical-align:1px;background:var(--holo);color:var(--violet)}
.count{font-family:var(--latin);font-weight:300;font-size:64px;line-height:1}
/* 知識 */
.life{position:relative;display:grid;gap:0;margin-top:6px}
.life div{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.life div:first-child{border-top:0}
.life div.me{background:linear-gradient(90deg,rgba(183,166,194,.28),transparent);border-radius:12px;padding-left:8px;margin-left:-8px}
.life b{font-family:var(--latin);font-size:18px;font-weight:600;line-height:1.3}
.life b small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--soft);font-weight:500}
.life p{margin:0;font-size:13.5px;line-height:1.65}
.life p em{font-style:normal;display:block;color:var(--violet);font-size:12.5px;margin-top:2px}
.layers{display:grid;gap:6px;margin-top:6px}

        ${[['缺水', '細紋多、緊繃 毛孔看起來乾乾的', '化妝水後一定要鎖水'], ['出油', '毛孔圓圓大大、整臉油亮', '清爽保濕 不要過度清潔'], ['老化毛孔', '毛孔變成長長的水滴狀', '保濕＋防曬 加強彈性'], ['角質厚', '摸起來粗粗的、暗暗的', '每週一次溫和代謝角質'], ['乾燥脫皮', '看得到小小的白屑', '溫和清潔、加強乳霜'], ['閉口', '膚色的小凸起 摸得到', '不要擠 清潔和保濕做好'], ['粉刺', '黑頭、白頭 鼻子最多', '定期清潔 不要用力摳'], ['細毛', '臉上細細的毛 光線下看得到', '正常的 不用特別處理']].map(([n, t, w]) => `<div><span class="sw pic"><img src="img/atlas-${['缺水', '出油', '老化毛孔', '角質厚', '乾燥脫皮', '閉口', '粉刺', '細毛'].indexOf(n) + 1}.jpg" alt="${n}示意" loading="lazy"></span><b>${n}</b><small>${t}</small><em>${w}</em></div>`).join('')}

      <div class="ktitle" id="k-dark"><h3>黑眼圈有 3 型</h3></div>
      <div class="pics" style="grid-template-columns:repeat(3,1fr)">${['血管型', '色素型', '結構型'].map((t, i) => `<figure><img src="img/dark-${i + 1}.jpg" alt="${t}黑眼圈示意" loading="lazy"><figcaption>${t}</figcaption></figure>`).join('')}</div>
      <div class="blk cream" style="margin-top:6px"><ul>${Object.entries(黑眼圈說明).map(([k, x]) => `<li><b>${k}</b> ~ ${x.看}<br><span class="small">${x.建}</span></li>`).join('')}</ul>
        <button class="pill ghost block" data-go="quiz-eye" style="margin-top:12px">測測看我是哪一型</button></div>

      <div class="ktitle"><h3>跟著溫妮佛按摩</h3></div>
      <div class="tools" style="margin-top:8px">${筆記們.slice(2).map(g => `<button class="tool cream" data-note="${g.頁}"><span class="ic" style="overflow:hidden;padding:0"><img src="img/${g.封}.jpg" alt="" style="width:100%;height:100%;object-fit:cover"></span><span><b>${g.名}</b><small>${g.小}</small></span><i>›</i></button>`).join('')}</div>
      <div class="section" style="margin-top:22px">${社群卡()}</div>
      <div class="ktitle" id="k-care"><h3>溫妮佛的養美重點</h3><span class="small">每天做一點點</span></div>
      ${關心們.map(c => `<details class="care cream" id="care-${c.id}" ${參.open === c.id ? 'open' : ''}><summary><span class="k">${c.英}</span><span><b>${c.名}</b><small>${c.說}</small></span><i>＋</i></summary><div class="body"><ol>${c.招.map(x => `<li>${x}</li>`).join('')}</ol></div></details>`).join('')}
      <div class="cta cream"><h3>想看溫妮佛示範？</h3><p>臉部按摩、法令紋、提拉手法 IG 上都有影片</p><a class="pill ghost block" href="${IG_URL}" target="_blank" rel="noopener">看溫妮佛的按摩影片</a><div style="height:10px"></div>${LINE_URL ? 聯絡鈕('加 LINE 問保養問題') : ''}</div>
      <p class="disclaim">以上是日常保養分享 不是醫療建議 ~ 有皮膚問題請找皮膚科醫師</p>`;
    v.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
    v.querySelectorAll('.mini-nav a').forEach(a => a.onclick = e => { e.preventDefault(); document.querySelector(a.getAttribute('href')).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    if (參.open) setTimeout(() => document.getElementById('care-' + 參.open)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
  };

  go('home');
})();
</script>
</body>
</html>
